  go.onclick=function(){if(on){acc+=Date.now()-t0;on=false;go.textContent="Mulai"}else{t0=Date.now();on=true;go.textContent="Berhenti"}};
  document.getElementById("rs").onclick=function(){acc=0;on=false;go.textContent="Mulai";show()};
  timer=setInterval(show,100);
 }
};

function dots(){document.querySelectorAll("#dots i").forEach(function(x,k){x.classList.toggle("f",k<ent.length)});var x=document.getElementById("pdel");if(x)x.textContent=ent.length?"Hapus":"Batalkan"}
function unlock(){locked=false;ent="";document.getElementById("lock").classList.add("off");
  if(!eventsOn){eventsOn=true;events.forEach(function(e){setTimeout(e.run,e.t*1000)})}}
function press(d){
  if(!locked||ent.length>=4)return;ent+=d;dots();
  if(ent.length===4){if(ent===PIN)setTimeout(unlock,150);else{var l=document.getElementById("dots");l.classList.add("shake");
   setTimeout(function(){l.classList.remove("shake");ent="";dots()},350)}}
}
(function(){
  var L={2:"ABC",3:"DEF",4:"GHI",5:"JKL",6:"MNO",7:"PQRS",8:"TUV",9:"WXYZ"},P=document.getElementById("pad");
  function cell(h,cls,fn,id){var b=document.createElement("button");b.innerHTML=h;if(cls)b.className=cls;if(id)b.id=id;b.onclick=fn;P.appendChild(b)}
  function num(d){cell(d+"<small>"+(L[d]||"")+"</small>","",function(){press(d)})}
  "123456789".split("").forEach(num);
  cell("Darurat","t",function(){});
  num("0");
  cell("Batalkan","t",function(){if(locked&&ent.length){ent=ent.slice(0,-1);dots()}},"pdel");
})();
document.addEventListener("keydown",function(e){if(/^\d$/.test(e.key))press(e.key);else if(e.key==="Backspace"&&locked){ent=ent.slice(0,-1);dots()}});
document.getElementById("banner").onclick=function(){if(locked)return;this.classList.remove("show");want=bn;openApp(dock[1],document.querySelectorAll("#dock .app")[1])};
function tick(){var d=new Date(),h=d.getHours(),m=("0"+d.getMinutes()).slice(-2);
  document.getElementById("clock").textContent=h+":"+m;document.getElementById("lt").textContent=("0"+h).slice(-2)+":"+m;
  document.getElementById("ld").textContent=d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"})}
tick();setInterval(tick,10000);
</script>
